name: mindlock
description: MindLock - Digital Discipline & Smart Reminder System
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^17.2.3

  # Local Database
  hive_flutter: ^1.1.0

  # Notifications & Alarms
  flutter_local_notifications: ^21.0.0
  android_alarm_manager_plus: ^5.0.0

  # Overlay & Floating Window
  flutter_overlay_window: ^0.5.0

  # Permissions
  permission_handler: ^12.0.1

  # UI & Fonts
  google_fonts: ^8.1.0
  lottie: ^3.1.2
  fl_chart: ^1.2.0
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0

  # Utilities
  uuid: ^4.4.2
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  path_provider: ^2.1.3
  audioplayers: ^6.0.0
  vibration: ^3.1.8
  local_auth: ^3.0.1
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0

  # Connectivity
  connectivity_plus: ^7.1.1

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  share_plus: ^13.1.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/
